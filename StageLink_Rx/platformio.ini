; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Pinned so plain `pio run` / `pio run -t upload` still target just the
; USB env, now that a second [env:] section exists below.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_extra_dirs =
    ../StageLink_Common

extra_scripts =
    pre:../StageLink_Common/scripts/generate_build_info.py
    pre:scripts/auto_upload.py

lib_deps =
    adafruit/Adafruit NeoPixel
    olikraus/U8g2
    madhephaestus/ESP32Servo
    adafruit/Adafruit DotStar

upload_port = /dev/cu.wchusbserial1110
upload_speed = 115200
monitor_port = /dev/cu.wchusbserial1110
monitor_speed = 115200

; OTA upload environment - use this once the RxQ is in Update Mode and
; showing its IP on the OLED. Inherits board/framework/lib_deps from
; [env:esp32dev] above; only the upload path changes.
; IP and password come from env vars (RXQ_OTA_IP / RXQ_OTA_PASSWORD) so
; the real OTA password never ends up in this committed file.
[env:rxq_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.RXQ_OTA_IP}
upload_flags =
    --auth=${sysenv.RXQ_OTA_PASSWORD}
